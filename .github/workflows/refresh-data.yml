name: Refresh returns data

on:
  schedule:
    - cron: '30 3 * * 1'   # every Monday, 9:00 AM IST
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run data
      - name: Commit if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/returns-data.json
          git diff --cached --quiet || git commit -m "Refresh returns data"
          git push
